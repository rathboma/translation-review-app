# translate.beekeeperstudio.io: a Cloudflare Pages project (this repo's root),
# a static frontend (dist/, built by Vite) and Pages Functions (functions/).
# See README.md.
#
# Secrets (wrangler pages secret put <NAME> --project-name translation-review):
#   TRANSLATIONS_TOKEN  the translation Worker's bearer token
#   GITHUB_TOKEN        a fine-grained token: Issues write on GITHUB_REPO only
#   TURNSTILE_SECRET    the Turnstile widget's secret key
name = "translation-review"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# The site whose translated copies are reviewed (the Worker answers on it).
TRANSLATIONS_URL = "https://www.beekeeperstudio.io"
# Where issues are filed.
GITHUB_REPO = "beekeeper-studio/web"
# Public. This is Cloudflare's always-passes testing key: replace it (and the
# TURNSTILE_SECRET) with the real widget's before launch.
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"

# Reviewers' name, email and issue numbers (never put in an issue) and the
# per-IP submission counters. Create it with `wrangler kv namespace create
# REVIEWERS` and put the id here.
[[kv_namespaces]]
binding = "REVIEWERS"
id = "00000000000000000000000000000000"

# Pull request previews (every deployment not from main). Pages needs vars and
# kv_namespaces for an environment given together, and once this file is the
# source of truth they can't be edited in the dashboard. A preview gets its own
# KV namespace, and files its issues on a scratch repository (replace it), so
# trying a branch never puts anything in the real one.
[env.preview.vars]
TRANSLATIONS_URL = "https://www.beekeeperstudio.io"
GITHUB_REPO = "OWNER/SCRATCH-REPO"
TURNSTILE_SITE_KEY = "1x00000000000000000000AA"

[[env.preview.kv_namespaces]]
binding = "REVIEWERS"
id = "00000000000000000000000000000000"
