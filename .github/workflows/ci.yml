# Tests every push and pull request; every push to main deploys to production,
# without waiting for the tests. There are no previews. Needs the secrets
# CLOUDFLARE_API_TOKEN (Pages: edit) and CLOUDFLARE_ACCOUNT_ID.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Vendored lint is as it was synced
        run: yarn check:vendor
      - run: yarn typecheck
      - run: yarn test
      - run: npx playwright install --with-deps chromium
      - run: yarn test:e2e
      - name: Keep the browser traces of a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.3"
          command: pages deploy dist --project-name=translation-review --branch=main
